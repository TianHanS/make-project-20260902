<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>来煤预报查询</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #root {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      min-height: 100vh;
      overflow: visible;
    }
    body.is-element-page #root {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <style>
.caf-page{min-height:100%;background:#fff;color:#000000e0}.caf-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 16px}.caf-head h1{margin:0;font-size:16px;font-weight:600;line-height:32px}.caf-filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px 12px}.caf-table-wrap{padding:0 12px 12px}.caf-table-wrap .ant-table-pagination{margin-bottom:0}.caf-empty{color:#00000040}.caf-color{display:inline-flex;align-items:center;gap:8px}.caf-color i{width:14px;height:14px;border-radius:2px;border:1px solid rgba(0,0,0,.15);flex:none}.caf-color span{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#000000a6}.caf-ops{display:flex;align-items:center;gap:12px}.caf-ops .ant-btn{padding-inline:0;height:auto}.caf-drawer{display:flex;flex-direction:column;gap:16px}.caf-config h2{margin:0 0 6px;font-size:14px;font-weight:600}.caf-coal-row{display:flex;align-items:center;gap:8px}.caf-coal-input{flex:1;min-width:0}.caf-coal-input .ant-select{width:100%}.caf-error{margin:8px 0 0;color:#cf1322;font-size:12px}.caf-drawer-footer{display:flex;align-items:center;justify-content:space-between}

  </style>
</head>
<body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
</html>
