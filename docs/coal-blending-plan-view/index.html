<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>配煤单查看</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body {
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }
    #root {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
      height: 100%;
      min-height: 100vh;
      overflow: visible;
    }
    body.is-element-page #root {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <style>
.cbpv-page{min-height:100vh;padding:24px 28px;background:radial-gradient(circle at 12% 0%,rgba(22,119,255,.06),transparent 42%),linear-gradient(180deg,#f5f7fa,#eef2f6);color:#1f2937;font-family:PingFang SC,Microsoft YaHei,system-ui,sans-serif}.cbpv-page-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;max-width:960px}.cbpv-page-hd h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}.cbpv-page-hd p{margin:8px 0 0;font-size:13px;color:#6b7280}.cbpv-section{border:1px solid #e5ebf0;border-radius:10px;background:#fff;padding:14px 16px}.cbpv-section-grow{flex:1;min-height:0;display:flex;flex-direction:column}.cbpv-section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cbpv-section-title{font-size:14px;font-weight:700;color:#1f2a37}.cbpv-section-title:before{content:"";display:inline-block;width:3px;height:12px;margin-right:8px;border-radius:2px;background:#1677ff;vertical-align:-1px}.cbpv-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px;margin-top:12px}.cbpv-item{display:flex;flex-direction:column;gap:4px;min-width:0}.cbpv-item .k{font-size:12px;color:#6b7280}.cbpv-item .v{font-size:13px;color:#111827;word-break:break-all}.cbpv-table-wrap{flex:1;min-height:0;overflow:hidden}.cbpv-matrix{height:100%}.cbpv-matrix .ant-table-thead>tr>th{background:#e8f1ff!important;color:#1f2a37;font-weight:700;text-align:center;position:sticky;top:0;z-index:3}.cbpv-matrix .ant-table-thead>tr>th.cbpv-row-label,.cbpv-matrix .ant-table-tbody>tr>td.cbpv-row-label{position:sticky;left:0;z-index:2}.cbpv-matrix .ant-table-thead>tr>th.cbpv-row-label{z-index:4;background:#e8f1ff!important}.cbpv-matrix .ant-table-tbody>tr>td{text-align:center}.cbpv-matrix .cbpv-row-label{background:#f8fafc;text-align:left!important}.cbpv-row-label-text{font-weight:600;color:#374151}.cbpv-num{font-variant-numeric:tabular-nums;font-family:DIN Alternate,Segoe UI,system-ui,sans-serif}.cbpv-reg{display:inline-block;max-width:100%;font-size:12px;line-height:1.35;word-break:break-all}.cbpv-footer{display:flex;align-items:center;justify-content:space-between;gap:12px}.cbpv-footer-hint{font-size:12px;color:#6b7280}@media (max-width: 840px){.cbpv-summary{grid-template-columns:1fr}.cbpv-page-hd{flex-direction:column}}

  </style>
</head>
<body>

  <script>
    (function () {
      var isComponent = false;
      if (document.body && (isComponent || window.location.pathname.includes('/components/'))) {
        document.body.classList.add('is-element-page');
      }
    })();
  </script>

  <div id="root"></div>

  
  <script src="./assets/react.production.min.js"></script>
  <script src="./assets/react-dom.production.min.js"></script>
  <script src="./assets/export-html-bootstrap.js"></script>

  <script>
    function waitForBootstrap(timeoutMs) {
      timeoutMs = timeoutMs || 10000;
      return new Promise(function (resolve, reject) {
        var startedAt = Date.now();
        function check() {
          if (window.HtmlTemplateBootstrap) {
            resolve(window.HtmlTemplateBootstrap);
            return;
          }
          if (Date.now() - startedAt >= timeoutMs) {
            reject(new Error('[Html Template] Bootstrap 初始化超时'));
            return;
          }
          setTimeout(check, 10);
        }
        check();
      });
    }

    function loadEntryScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        script.src = src;
        script.async = false;
        script.onload = function () { resolve(); };
        script.onerror = function () { reject(new Error('[Html Template] 入口脚本加载失败: ' + src)); };
        document.body.appendChild(script);
      });
    }

    async function bootstrapAndRender() {
      try {
        var bootstrap = await waitForBootstrap();
        var renderComponent = bootstrap.renderComponent;
        window.React = bootstrap.React;
        window.ReactDOM = bootstrap.ReactDOM;

        await loadEntryScript('./index.js');
        

        var Component = window.UserComponent && (window.UserComponent.Component || window.UserComponent.default || window.UserComponent);
        if (!Component) {
          throw new Error('[Html Template] 入口脚本未暴露 UserComponent');
        }

        renderComponent(Component);
      } catch (error) {
        console.error('[Html Template] 页面初始化失败:', error);
      }
    }

    bootstrapAndRender();
  </script>

</body>
</html>
